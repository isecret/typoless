name: Typoless

options:
  bundleIdPrefix: com.isecret
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

targets:
  Typoless:
    type: application
    platform: macOS
    sources:
      - path: Typoless
        excludes:
          - "**/.gitkeep"
          - "Resources/rnnoise"
          - "Resources/funasr"
    resources:
      - path: Typoless/Resources/rnnoise
        buildPhase: resources
        optional: true
      - path: Typoless/Resources/funasr/manifest.json
        buildPhase: resources
        optional: true
      - path: Typoless/Resources/funasr/runtime
        buildPhase: resources
        optional: true
      - path: Typoless/Resources/funasr/worker
        buildPhase: resources
        optional: true
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isecret.typoless
        CODE_SIGN_ENTITLEMENTS: Typoless/Typoless.entitlements
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "0.1.6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Typoless/Info.plist
    preBuildScripts:
      - name: "Validate Source Resources"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/validate-source-resources.stamp"
        script: |
          # RNNoise (required for new pipeline)
          RNNOISE_DIR="${SRCROOT}/Typoless/Resources/rnnoise"
          if [ ! -f "${RNNOISE_DIR}/lib/librnnoise.dylib" ]; then
            echo "error: RNNoise library not found. Run ./scripts/setup-rnnoise.sh first."
            exit 1
          fi

          # FunASR runtime 和 worker（模型外置到用户目录）
          FUNASR_DIR="${SRCROOT}/Typoless/Resources/funasr"
          if [ ! -f "${FUNASR_DIR}/manifest.json" ]; then
            echo "error: FunASR manifest not found. Run ./scripts/setup-funasr.sh first."
            exit 1
          fi
          if [ ! -f "${FUNASR_DIR}/worker/funasr_worker.py" ]; then
            echo "error: FunASR worker not found. Run ./scripts/setup-funasr.sh first."
            exit 1
          fi
          touch "${SCRIPT_OUTPUT_FILE_0}"
    postBuildScripts:
      - name: "Copy Resources and Fix Permissions"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/.resources-copied.stamp"
        script: |
          # RNNoise
          RNNOISE_SRC="${SRCROOT}/Typoless/Resources/rnnoise"
          RNNOISE_DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/rnnoise"
          if [ -d "${RNNOISE_SRC}" ]; then
            mkdir -p "$(dirname "${RNNOISE_DST}")"
            ditto "${RNNOISE_SRC}" "${RNNOISE_DST}"
          fi

          # FunASR
          FUNASR_SRC="${SRCROOT}/Typoless/Resources/funasr"
          FUNASR_DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/funasr"
          if [ -d "${FUNASR_SRC}" ]; then
            mkdir -p "$(dirname "${FUNASR_DST}")"
            rm -rf "${FUNASR_DST}"
            mkdir -p "${FUNASR_DST}"
            [ -f "${FUNASR_SRC}/manifest.json" ] && ditto "${FUNASR_SRC}/manifest.json" "${FUNASR_DST}/manifest.json"
            [ -d "${FUNASR_SRC}/runtime" ] && ditto "${FUNASR_SRC}/runtime" "${FUNASR_DST}/runtime"
            [ -d "${FUNASR_SRC}/worker" ] && ditto "${FUNASR_SRC}/worker" "${FUNASR_DST}/worker"
            [ -f "${FUNASR_DST}/runtime/python3" ] && chmod +x "${FUNASR_DST}/runtime/python3"
            [ -f "${FUNASR_DST}/worker/funasr_worker.py" ] && chmod +x "${FUNASR_DST}/worker/funasr_worker.py"
          fi
          touch "${SCRIPT_OUTPUT_FILE_0}"
      - name: "Apply Derived App Version"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          "${SRCROOT}/../scripts/apply-derived-version.sh" --fallback "${MARKETING_VERSION}"

  TypolessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TypolessTests
    dependencies:
      - target: Typoless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isecret.typoless.tests
        GENERATE_INFOPLIST_FILE: YES

name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_XCODE_VERSION: "26.3"
  EXPECTED_SDK_VERSION: "26.2"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        id: setup-xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.EXPECTED_XCODE_VERSION }}

      - name: Verify Xcode environment
        run: ./scripts/ci/verify-xcode-env.sh

      - name: Prepare build environment
        run: ./scripts/ci/prepare-macos-build.sh

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          echo "Selected Xcode path: ${{ steps.setup-xcode.outputs.path }}"


      - name: Build
        working-directory: app
        run: |
          mkdir -p .derivedData
          set -o pipefail
          xcodebuild build \
            -project Typoless.xcodeproj \
            -scheme Typoless \
            -destination 'platform=macOS' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee .derivedData/build.log

      - name: Test
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Typoless.xcodeproj \
            -scheme Typoless \
            -destination 'platform=macOS' \
            -derivedDataPath .derivedData \
            -resultBundlePath .derivedData/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee .derivedData/test.log

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/.derivedData/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/.derivedData/build.log
            app/.derivedData/test.log
            app/.derivedData/Logs/Build
          retention-days: 7
          if-no-files-found: ignore
